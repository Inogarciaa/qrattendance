# Render Blueprint for the Scanly API.
#
# In the Render dashboard: New + > Blueprint, pick this repository, and Render
# reads this file. Variables marked `sync: false` are prompted for on creation
# and are never committed to git.
services:
  - type: web
    name: lacoqr-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_MODE
        value: supabase
      - key: AUTH_EMAIL_DOMAIN
        value: lccb.local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
